# Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=master-service
spring.cloud.gateway.routes[1].uri=lb://MASTER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/master/**
spring.cloud.gateway.routes[1].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[2].id=seat-matrix-service
spring.cloud.gateway.routes[2].uri=lb://SEAT-MATRIX-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/seats/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[3].id=applicant-service
spring.cloud.gateway.routes[3].uri=lb://APPLICANT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/applicants/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[4].id=admission-service
spring.cloud.gateway.routes[4].uri=lb://ADMISSION-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/admissions/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[5].id=fee-service
spring.cloud.gateway.routes[5].uri=lb://FEE-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/fees/**
spring.cloud.gateway.routes[5].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[6].id=dashboard-service
spring.cloud.gateway.routes[6].uri=lb://DASHBOARD-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/dashboard/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthFilter

