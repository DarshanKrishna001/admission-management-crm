server.port=8080
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=YWRtaXNzaW9uUHJvU2VjcmV0S2V5Rm9ySldUVG9rZW5HZW5lcmF0aW9uMjAyNg==

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

#
spring.cloud.gateway.routes[1].id=applicants-portal
spring.cloud.gateway.routes[1].uri=lb://APPLICANTS-PORTAL
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/portal/**


spring.cloud.gateway.routes[2].id=master-service
spring.cloud.gateway.routes[2].uri=lb://MASTER-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/master/**
spring.cloud.gateway.routes[2].filters[0]=JwtAuthFilter


spring.cloud.gateway.routes[3].id=seat-matrix-service
spring.cloud.gateway.routes[3].uri=lb://SEAT-MATRIX-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/seats/**
spring.cloud.gateway.routes[3].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[4].id=applicant-service
spring.cloud.gateway.routes[4].uri=lb://APPLICANT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/applicants/**
spring.cloud.gateway.routes[4].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[5].id=admission-service
spring.cloud.gateway.routes[5].uri=lb://ADMISSION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/admissions/**
spring.cloud.gateway.routes[5].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[6].id=fee-service
spring.cloud.gateway.routes[6].uri=lb://FEE-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/fees/**
spring.cloud.gateway.routes[6].filters[0]=JwtAuthFilter

spring.cloud.gateway.routes[7].id=dashboard-service
spring.cloud.gateway.routes[7].uri=lb://DASHBOARD-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/dashboard/**
spring.cloud.gateway.routes[7].filters[0]=JwtAuthFilter







