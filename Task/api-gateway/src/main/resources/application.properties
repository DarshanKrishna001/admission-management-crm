server.port=8080
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Routes
spring.cloud.gateway.routes[0].id=master-service
spring.cloud.gateway.routes[0].uri=lb://master-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/master/**

spring.cloud.gateway.routes[1].id=seat-matrix-service
spring.cloud.gateway.routes[1].uri=lb://seat-matrix-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/seats/**

spring.cloud.gateway.routes[2].id=applicant-service
spring.cloud.gateway.routes[2].uri=lb://applicant-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/applicants/**

spring.cloud.gateway.routes[3].id=admission-service
spring.cloud.gateway.routes[3].uri=lb://admission-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admissions/**

spring.cloud.gateway.routes[4].id=fee-service
spring.cloud.gateway.routes[4].uri=lb://fee-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/fees/**

spring.cloud.gateway.routes[5].id=dashboard-service
spring.cloud.gateway.routes[5].uri=lb://dashboard-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/dashboard/**

# Disable default filters to avoid CORS duplication
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Actuator
management.endpoints.web.exposure.include=*